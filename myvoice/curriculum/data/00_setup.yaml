module: S
sections:
  - code: S-ROOM
    title: Room tone
    category: room_tone
    defaults: {kind: silence, lang: none, style: analysis, readcheck: false, train: false, repeat: per_session, max_sec: 5}
    instruction: Stay completely silent for 5 seconds. The studio measures your room's background noise.
    exercises:
      - {text: "", context: "Sit as you will sit while recording. Keep still, breathe quietly through your nose, and don't touch the mic, desk or keyboard."}

  - code: S-CLAP
    title: Room echo check
    category: room_tone
    defaults: {kind: clap, lang: none, style: analysis, readcheck: false, train: false, repeat: per_session, max_sec: 4}
    instruction: "Press record, clap your hands once (sharply, at your normal recording position), then stay silent until it stops."
    exercises:
      - {text: "", context: "The studio measures how long the clap echoes in your room. Under about 0.4 s is ideal for voice recording."}

  - code: S-MIC
    title: Microphone check
    category: voice_identity
    defaults: {kind: sentence, lang: en, style: conversational, train: false, repeat: per_session}
    instruction: Read naturally at your normal speaking volume. This checks your level, noise and microphone quality.
    exercises:
      - "Hello, this is my microphone check. I am sitting comfortably, about a hand's width from the mic, and speaking in my normal voice."

  - code: S-CONSENT
    title: Consent and ownership statement
    category: consent
    defaults: {kind: sentence, style: formal, train: false}
    instruction: Read this statement in your own voice. It documents that the voice in this dataset is yours and is being recorded by choice.
    exercises:
      - {lang: en, text: "My name is {name}. This is my own voice, recorded by me of my own free will. I consent to these recordings being used to create a synthetic version of my voice for my own projects, and for no one else without my permission."}
      - {lang: hi, text: "मेरा नाम {name} है। यह मेरी अपनी आवाज़ है, जिसे मैंने अपनी इच्छा से रिकॉर्ड किया है। मेरी सहमति है कि इन रिकॉर्डिंग्स से मेरी आवाज़ का एक कृत्रिम रूप बनाया जाए, सिर्फ़ मेरे अपने कामों के लिए, और मेरी अनुमति के बिना किसी और के लिए नहीं।"}
