module: D
sections:
  - code: D-EVD
    title: Everyday Hindi
    core_first: 4
    category: conversational
    defaults: {kind: sentence, lang: hi, style: conversational}
    instruction: रोज़मर्रा की हिंदी, जैसे घर पर बोलते हैं।
    exercises:
      - "सुबह उठते ही सबसे पहले एक कप चाय चाहिए, उसके बिना दिन शुरू ही नहीं होता।"
      - "आज सब्ज़ी मंडी में टमाटर बहुत महँगे मिल रहे थे।"
      - "बच्चों को स्कूल छोड़कर सीधे दफ़्तर निकलना है।"
      - "शाम को छत पर बैठकर ठंडी हवा का मज़ा ही कुछ और है।"
      - "बिजली का बिल इस महीने पिछली बार से ज़्यादा आया है।"
      - "रविवार को पूरा परिवार साथ बैठकर खाना खाता है।"
      - "पड़ोस वाली आंटी ने आज फिर से गरमागरम पकौड़े भेजे।"
      - "बारिश में भीगने के बाद अदरक वाली चाय से बेहतर कुछ नहीं।"

  - code: D-FRM
    title: Formal Hindi
    core_first: 3
    category: professional_narration
    defaults: {kind: sentence, lang: hi, style: formal}
    instruction: औपचारिक और गरिमापूर्ण, जैसे किसी मंच से बोल रहे हों।
    exercises:
      - "आदरणीय अतिथिगण, आप सभी का इस समारोह में हार्दिक स्वागत है।"
      - "कृपया ध्यान दें, कार्यक्रम निर्धारित समय पर आरंभ होगा।"
      - "सरकार ने किसानों की सहायता के लिए एक नई योजना की घोषणा की है।"
      - "इस विषय पर विस्तार से चर्चा करने के लिए एक समिति का गठन किया गया है।"
      - "हम आपके सहयोग और विश्वास के लिए हृदय से आभारी हैं।"

  - code: D-CNV
    title: Conversational Hindi
    core_first: 3
    category: conversational
    defaults: {kind: sentence, lang: hi, style: conversational}
    instruction: दोस्त से बात करने जैसा, बिल्कुल सहज।
    exercises:
      - "अरे यार, कहाँ थे इतने दिनों से? फ़ोन भी नहीं उठा रहे थे।"
      - "चलो, आज बाहर कुछ अच्छा खाने चलते हैं।"
      - "सच बताऊँ तो मुझे ये फ़िल्म ज़्यादा पसंद नहीं आई।"
      - "तुम चिंता मत करो, सब ठीक हो जाएगा।"
      - "अच्छा सुनो, कल सुबह जल्दी आ जाना, काम बहुत है।"
      - "हाँ हाँ, मुझे पता है, तुम पहले भी ये बात बता चुके हो।"

  - code: D-SHD
    title: Formal Hindi vocabulary
    core_first: 3
    category: professional_narration
    defaults: {kind: sentence, lang: hi, style: formal}
    instruction: शुद्ध हिंदी शब्द, लेकिन बोलचाल की स्वाभाविक लय में।
    exercises:
      - "परिश्रम, अनुशासन और आत्मविश्वास सफलता के तीन आधार स्तंभ हैं।"
      - "विद्यालय के प्रधानाचार्य ने विद्यार्थियों की उपलब्धियों की सराहना की।"
      - "प्रकृति का संरक्षण करना हम सबका नैतिक कर्तव्य है।"
      - "भारतीय संस्कृति में अतिथि को देवता के समान माना जाता है।"
      - "निरंतर अभ्यास से ही किसी भी कला में निपुणता प्राप्त होती है।"

  - code: D-EXP
    title: Common expressions and idioms
    core_first: 4
    category: conversational
    defaults: {kind: sentence, lang: hi, style: conversational}
    instruction: ऐसे बोलिए जैसे बातचीत में किसी को ये कहावत सुना रहे हों।
    exercises:
      - "नाच न जाने आँगन टेढ़ा।"
      - "अब पछताए होत क्या, जब चिड़िया चुग गई खेत।"
      - "जितनी चादर हो, उतने ही पैर फैलाने चाहिए।"
      - "दूर के ढोल सुहावने लगते हैं।"
      - "अपने मुँह मियाँ मिट्ठू बनना अच्छी बात नहीं है।"
      - "एक अनार, सौ बीमार।"
      - "बूँद-बूँद से घड़ा भरता है।"
      - "जहाँ चाह, वहाँ राह।"

  - code: D-STO
    title: Hindi storytelling
    core_first: 2
    category: documentary_narration
    defaults: {kind: paragraph, lang: hi, style: storytelling}
    instruction: कहानी की तरह सुनाइए; घटनाओं के साथ आवाज़ और रफ़्तार बदलने दीजिए।
    exercises:
      - "एक गाँव में रामू नाम का एक किसान रहता था। उसके पास ज़मीन का एक छोटा-सा टुकड़ा था, लेकिन मेहनत में वह किसी से कम नहीं था। एक साल ऐसा सूखा पड़ा कि पूरे गाँव की फ़सल बर्बाद हो गई। तब रामू ने कुछ ऐसा किया, जिसे गाँव वाले आज भी याद करते हैं।"
      - "बचपन में दादी हमें रात को कहानियाँ सुनाया करती थीं। बिजली चली जाती, लालटेन की रोशनी में हम सब उनके चारों ओर बैठ जाते, और वे राजा-रानी, जादुई पेड़ और बोलने वाले तोते की ऐसी बातें सुनातीं कि नींद कब आ जाती, पता ही नहीं चलता।"
      - "स्टेशन पर भीड़ थी। ट्रेन आने में अभी बीस मिनट बाकी थे। तभी एक छोटी-सी बच्ची रोती हुई दिखाई दी। उसकी माँ भीड़ में कहीं खो गई थी। एक चायवाले ने उसे अपने पास बैठाया, बिस्कुट दिए और माइक पर घोषणा करवाई। दस मिनट बाद माँ दौड़ती हुई आई और बच्ची को गले से लगा लिया।"

  - code: D-EMO
    title: Emotional Hindi narration
    category: emotional
    defaults: {kind: sentence, lang: hi, style: narration}
    instruction: भावना को आवाज़ में आने दीजिए, लेकिन आवाज़ आपकी अपनी ही रहे।
    exercises:
      - {text: "वह आख़िरी बार अपने पुराने घर के आँगन में खड़ा था। हर दीवार पर बचपन की कोई न कोई याद लिखी थी।", emotion: sadness, context: "A short film's closing narration: a man leaving his childhood home forever."}
      - {text: "हालात चाहे जैसे भी हों, जो इंसान हार नहीं मानता, उसे दुनिया की कोई ताक़त नहीं रोक सकती।", emotion: inspirational, context: "The final line of a motivational reel."}
      - {text: "मैं समझ {सकता|सकती} हूँ कि ये वक़्त आपके लिए कितना मुश्किल है। आप अकेले नहीं हैं।", emotion: empathy, context: "Speaking gently to someone who has just lost their job."}
      - {text: "आज बरसों बाद पूरा परिवार एक साथ बैठा था, और घर में फिर से वही पुरानी हँसी गूँज रही थी।", emotion: happiness, context: "Narrating a warm family reunion during Diwali."}

  - code: D-NEWS
    title: News-style Hindi
    core_first: 3
    category: professional_narration
    defaults: {kind: sentence, lang: hi, style: news}
    instruction: "समाचार वाचक की तरह: स्पष्ट, संतुलित और भरोसेमंद।"
    exercises:
      - "नमस्कार, आप देख रहे हैं आज की प्रमुख ख़बरें।"
      - "देश के कई हिस्सों में आज भारी बारिश की चेतावनी जारी की गई है।"
      - "मौसम विभाग के अनुसार अगले अड़तालीस घंटों में तापमान में गिरावट आ सकती है।"
      - "सरकार ने आज संसद में नया कृषि विधेयक पेश किया, जिस पर विपक्ष ने कड़ी आपत्ति जताई।"
      - "खेल जगत से बड़ी ख़बर: भारतीय टीम ने रोमांचक मुक़ाबले में जीत हासिल की।"

  - code: D-DOC
    title: Documentary-style Hindi
    core_first: 2
    category: documentary_narration
    defaults: {kind: sentence, lang: hi, style: documentary}
    instruction: "डॉक्यूमेंट्री की तरह: ठहराव, गहराई और जिज्ञासा के साथ।"
    exercises:
      - "हिमालय की गोद में बसे इन गाँवों में ज़िंदगी आज भी प्रकृति की लय पर चलती है।"
      - "हज़ारों साल पहले इसी नदी के किनारे दुनिया की सबसे पुरानी सभ्यताओं में से एक ने जन्म लिया था।"
      - "राजस्थान के रेगिस्तान में पानी की हर एक बूँद सोने से भी ज़्यादा क़ीमती है।"
      - "सुबह की पहली किरण के साथ ही बाज़ार में हलचल शुरू हो जाती है।"

  - code: D-LNG
    title: Long Hindi paragraphs
    core_first: 2
    category: documentary_narration
    defaults: {kind: paragraph, lang: hi, style: narration}
    instruction: पूरा अनुच्छेद एक प्रवाह में पढ़िए, जहाँ स्वाभाविक लगे वहाँ साँस लीजिए।
    exercises:
      - "भारत की खेती आज एक बड़े बदलाव के दौर से गुज़र रही है। एक तरफ़ जलवायु परिवर्तन, घटता भूजल और बढ़ती लागत किसानों के सामने नई चुनौतियाँ खड़ी कर रहे हैं, तो दूसरी तरफ़ ड्रिप सिंचाई, मोबाइल पर मौसम की जानकारी और किसान उत्पादक संगठन नई उम्मीदें भी जगा रहे हैं। आने वाले बरसों में यह तय होगा कि हम इनमें से किस रास्ते को मज़बूत बनाते हैं।"
      - "पुरानी दिल्ली की गलियों में चलना इतिहास की किताब के पन्ने पलटने जैसा है। हर मोड़ पर कोई पुरानी हवेली, कोई मस्जिद या कोई मंदिर खड़ा है, जो सदियों से आते-जाते लोगों को देख रहा है। यहाँ जलेबी, परांठों और कबाब की ख़ुशबू हवा में घुली रहती है, और दुकानदारों की आवाज़ें इस शहर की धड़कन बन जाती हैं।"
      - "सफलता कोई एक दिन में मिलने वाली चीज़ नहीं है। यह रोज़ की छोटी-छोटी आदतों से बनती है: समय पर उठना, थोड़ा पढ़ना, अपने काम को पूरी ईमानदारी से करना और गलतियों से सीखना। जो लोग इन आदतों को सालों तक निभाते हैं, उनके लिए एक दिन ऐसा ज़रूर आता है जब दुनिया कहती है कि उनकी किस्मत अच्छी थी।"

  - code: D-NUM
    title: Numbers in Hindi sentences
    core_first: 3
    category: numbers_special
    defaults: {kind: sentence, lang: hi, style: neutral}
    instruction: अंकों को वैसे पढ़िए जैसे नीचे लिखा है, ताकि रिकॉर्डिंग और लिखित पाठ मेल खाएँ।
    exercises:
      - {text: "इस साल गेहूँ का समर्थन मूल्य 2,425 रुपये प्रति क्विंटल तय किया गया है।", spoken: "इस साल गेहूँ का समर्थन मूल्य दो हज़ार चार सौ पच्चीस रुपये प्रति क्विंटल तय किया गया है।"}
      - {text: "15 अगस्त 1947 को भारत आज़ाद हुआ।", spoken: "पंद्रह अगस्त उन्नीस सौ सैंतालीस को भारत आज़ाद हुआ।"}
      - {text: "ट्रेन सुबह 6:45 पर प्लेटफ़ॉर्म नंबर 3 से जाएगी।", spoken: "ट्रेन सुबह पौने सात बजे प्लेटफ़ॉर्म नंबर तीन से जाएगी।"}
      - {text: "कंपनी का मुनाफ़ा 12% बढ़कर 3.5 करोड़ रुपये हो गया।", spoken: "कंपनी का मुनाफ़ा बारह प्रतिशत बढ़कर साढ़े तीन करोड़ रुपये हो गया।"}
      - {text: "हमारी कक्षा में 48 विद्यार्थी हैं, जिनमें 27 लड़कियाँ हैं।", spoken: "हमारी कक्षा में अड़तालीस विद्यार्थी हैं, जिनमें सत्ताईस लड़कियाँ हैं।"}
